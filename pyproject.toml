[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trillionaire"
version = "0.1.0"
description = "Production-grade automated NSE MIS Intraday Stock + Index Algorithmic Trading Engine targeting Zerodha Kite Connect"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Quantitative Systems Architect", email = "quant@trillionaire.internal" },
]
license = { text = "Proprietary" }
keywords = ["algorithmic-trading", "zerodha", "kiteconnect", "intraday", "nse", "quantitative-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pyyaml>=6.0.1",
    "kiteconnect>=4.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyotp>=2.9.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
