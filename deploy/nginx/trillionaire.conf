# ==============================================================================
# TRILLIONAIRE ALGO ENGINE - NGINX REVERSE PROXY CONFIGURATION
# Production SSL Reverse Proxy for trillionaire-trade.duckdns.org
# Routes HTTP (80) -> HTTPS (443)
# Routes /api/ & /ws/ -> FastAPI Engine (8000), / -> Next.js Dashboard (3000)
# ==============================================================================

upstream trillionaire_engine {
    server engine:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream trillionaire_dashboard {
    server dashboard:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Ingress (Port 80) -> Permanent 301 Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name trillionaire-trade.duckdns.org 32.236.106.39 _;

    # ACME Challenge verification for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to production HTTPS DuckDNS domain
    location / {
        return 301 https://trillionaire-trade.duckdns.org$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Production HTTPS (Port 443) -> SSL Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trillionaire-trade.duckdns.org;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/trillionaire-trade.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trillionaire-trade.duckdns.org/privkey.pem;

    # Modern SSL Protocols & Hardened Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;

    # Institutional Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression for web client assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 1. API Endpoints -> FastAPI Engine
    location /api/ {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 1a. Real-Time SSE Stream Endpoint -> FastAPI Engine
    location /api/v1/stream {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 1b. Zerodha Kite OAuth Callbacks -> FastAPI Engine
    location = /callback {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /kite/callback {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/callback {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. FastAPI OpenAPI Docs & Schema
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. High-Frequency Real-Time WebSocket Telemetry -> FastAPI Engine
    location /ws/ {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Keep WebSocket connection alive throughout active trading sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
    }

    # 4. Next.js Static Assets & Standalone Build Cache
    location /_next/static/ {
        proxy_pass http://trillionaire_dashboard/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # 5. Visual Trading Cockpit Dashboard -> Next.js App
    location / {
        proxy_pass http://trillionaire_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
