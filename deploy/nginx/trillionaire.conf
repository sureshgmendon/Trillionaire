# ==============================================================================
# TRILLIONAIRE ALGO ENGINE - NGINX REVERSE PROXY CONFIGURATION
# Routes HTTP / Dashboard -> Next.js (3000), /api/ & /ws/ -> FastAPI Engine (8000)
# ==============================================================================

upstream trillionaire_engine {
    server engine:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream trillionaire_dashboard {
    server dashboard:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    # Institutional Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for web client assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 1. API Endpoints -> FastAPI Engine
    location /api/ {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2. FastAPI OpenAPI Docs & Schema
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. High-Frequency Real-Time WebSocket Telemetry -> FastAPI
    location /ws/ {
        proxy_pass http://trillionaire_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connection alive throughout active trading sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 4. Next.js Static Assets & Standalone Build Cache
    location /_next/static/ {
        proxy_pass http://trillionaire_dashboard/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # 5. Visual Trading Cockpit Dashboard -> Next.js App
    location / {
        proxy_pass http://trillionaire_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
