# ==============================================================================
# TRILLIONAIRE ALGO ENGINE - PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Mumbai AWS Lightsail / VPS Production Stack (Redis AOF + Engine + Dashboard + Nginx)
# ==============================================================================

version: "3.8"

networks:
  trillionaire-net:
    driver: bridge

volumes:
  redis_data:
    driver: local

services:
  # In-Memory Cache, Pub/Sub & Token Vault
  redis:
    image: redis:7-alpine
    container_name: trillionaire-redis
    restart: always
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trillionaire-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # FastAPI Quant Engine & Telemetry Broadcaster
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    container_name: trillionaire-engine
    restart: always
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - CAPITAL_TIER=${CAPITAL_TIER:-TIER_1_MICRO}
      - TZ=Asia/Kolkata
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../logs:/opt/trillionaire/logs
      - ../.env:/opt/trillionaire/.env
      - ../research_lab/artifacts:/opt/trillionaire/research_lab/artifacts
      - ../research_lab/data_store:/opt/trillionaire/research_lab/data_store
      - ../sentinel/artifacts:/opt/trillionaire/sentinel/artifacts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trillionaire-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M

  # Next.js Institutional Trading Cockpit
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://32.236.106.39}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://32.236.106.39/ws/stream}
        - NEXT_PUBLIC_ADMIN_KEY=${NEXT_PUBLIC_ADMIN_KEY:-trillionaire_super_secret_local_key}
    container_name: trillionaire-dashboard
    restart: always
    env_file:
      - ../web_dashboard/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - trillionaire-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # Nginx Ingress & SSL Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: trillionaire-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/trillionaire.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard
      - engine
    networks:
      - trillionaire-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
